name: Build and validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check version and release notes
        run: python tools/check-release.py
      - name: Core contracts
        run: dotnet run --project tests/FFXILauncher.Core.Tests
      - name: Dashboard and Windows credential checks
        run: dotnet run --project tests/FFXILauncher.Desktop.Smoke
      - name: Native POL client sizing
        run: dotnet run --project tests/FFXILauncher.Desktop.Smoke -- --pol-sizing-test
      - name: Scaled Windows OCR
        shell: powershell
        run: ./tests/test_windows_ocr.ps1
      - name: Parse Windows scripts
        shell: pwsh
        run: |
          Get-ChildItem tools/*.ps1 | ForEach-Object {
            $parseErrors = $null
            $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
      - name: Publish Windows build
        shell: pwsh
        run: ./tools/publish-windows.ps1
      - name: Publish standalone executable
        shell: pwsh
        run: ./tools/publish-standalone.ps1
      - name: Verify standalone helpers and native graphics
        shell: pwsh
        run: |
          $resultPath = Join-Path $env:RUNNER_TEMP 'standalone-check.json'
          $exe = (Resolve-Path 'artifacts/windows-standalone/FFXILauncher.Desktop.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList ('--package-check "' + $resultPath + '"') -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Standalone package check failed.' }
          $result = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
          if (-not $result.Standalone -or -not $result.NativeImageDecoded -or -not $result.ApplicationIconDecoded -or -not $result.InstallerPrepared -or -not $result.LicensesAvailable -or $result.SupportFilesVerified -lt 10 -or $result.ArtworkThemesVerified -ne 12) { throw 'Standalone package is incomplete.' }
          $folderResultPath = Join-Path $env:RUNNER_TEMP 'folder-check.json'
          $folderExe = (Resolve-Path 'artifacts/windows-x64/FFXILauncher.Desktop.exe').Path
          $folderProcess = Start-Process -FilePath $folderExe -ArgumentList ('--package-check "' + $folderResultPath + '"') -Wait -PassThru
          if ($folderProcess.ExitCode -ne 0) { throw 'Folder package check failed.' }
          $folderResult = Get-Content -LiteralPath $folderResultPath -Raw | ConvertFrom-Json
          if (-not $folderResult.ApplicationIconDecoded) { throw 'Folder application icon is missing.' }
          if ($result.LoginFlowFingerprint -notmatch '^[A-F0-9]{64}$' -or $result.LoginFlowFingerprint -cne $folderResult.LoginFlowFingerprint) { throw 'Packaging changed login-flow compatibility.' }
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: ffxi-account-manager-windows-x64
          path: |
            artifacts/windows-x64/
            artifacts/windows-standalone/
  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Companion IPC contracts
        run: |
          mkdir -p /tmp/ffxi-manager-addon-test/data
          lua5.1 tests/test_manager_addon.lua /tmp/ffxi-manager-addon-test/
          mkdir -p /tmp/ffxi-manager-maximum-test/data
          lua5.1 tests/test_manager_maximums.lua /tmp/ffxi-manager-maximum-test/
          for mode in missing cached failed; do
            mkdir -p /tmp/ffxi-manager-progression-$mode/data
            lua5.1 tests/test_manager_progression.lua /tmp/ffxi-manager-progression-$mode/ $mode
          done
