        run: |
          python3 - <<'PY'
          """Delete only the explicit artifact IDs in a previously verified archive manifest."""
          import datetime
          import json
          import os
          import urllib.error
          import urllib.request
          
          
          def delete_archived(snapshot, repository, request):
              if repository != snapshot['repository']:
                  raise ValueError('Repository does not match the verified archive')
              cutoff = datetime.datetime.fromisoformat(snapshot['cutoff'])
              completed = set()
              deleted = 0
              for expected in snapshot['artifacts']:
                  artifact_id = int(expected['id'])
                  endpoint = f'/actions/artifacts/{artifact_id}'
                  try:
                      current = request(endpoint)
                  except urllib.error.HTTPError as error:
                      if error.code == 404:
                          print(f'Already absent: {artifact_id}', flush=True)
                          continue
                      raise
                  created = datetime.datetime.fromisoformat(current['created_at'].replace('Z', '+00:00'))
                  if (not expected['verified'] or not expected['digest'].startswith('sha256:')
                          or current['id'] != artifact_id
                          or current.get('digest') != expected['digest']
                          or current['size_in_bytes'] != expected['size_in_bytes']
                          or current['workflow_run']['id'] != expected['run_id']
                          or created >= cutoff):
                      raise ValueError(f'Artifact {artifact_id} differs from the verified archive; keeping hosted copy')
                  run_id = expected['run_id']
                  if run_id not in completed:
                      if request(f'/actions/runs/{run_id}')['status'] != 'completed':
                          raise ValueError(f'Run {run_id} is still active; keeping hosted artifact')
                      completed.add(run_id)
                  request(endpoint, 'DELETE')
                  deleted += 1
                  print(f'Removed archived artifact {artifact_id}', flush=True)
              return deleted
          
          
          def main():
              repository = os.environ['GITHUB_REPOSITORY']
              snapshot = json.loads(os.environ['VERIFIED_ARCHIVE_MANIFEST'])
              token = os.environ['GH_TOKEN']
          
              def request(endpoint, method='GET'):
                  url = f'https://api.github.com/repos/{repository}' + endpoint
                  with urllib.request.urlopen(urllib.request.Request(url, method=method, headers={
                      'Authorization': 'Bearer ' + token,
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'verified-artifact-cleanup',
                  }), timeout=120) as response:
                      return json.load(response) if method == 'GET' else None
          
              deleted = delete_archived(snapshot, repository, request)
              summary = f'Removed {deleted} artifacts from the verified archive manifest; evidence remains in the private local archive.\n'
              print(summary)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
                  stream.write(summary)
          
          
          if __name__ == '__main__':
              main()
          PY
